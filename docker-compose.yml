version: '3.8'

services:
  backend:
    build: .
    container_name: autosar_backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./chromadb:/app/chromadb
      - ./database:/app/database
      - ./reports:/app/reports
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build: .
    container_name: autosar_frontend
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - backend
